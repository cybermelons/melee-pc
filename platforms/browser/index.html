<title>Melee Web</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0 auto; max-width: 960px; padding: 16px; background: #111; color: #eee; font: 15px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; background: #000; }
  #bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  #stats { margin-left: auto; font-variant-numeric: tabular-nums; color: #9c9; }
  #status { color: #fc6; }
  pre { white-space: pre-wrap; color: #999; font-size: 12px; max-height: 14em; overflow: auto; }
  #launch a { color: #9cf; margin-right: 12px; }
  #launch-hint { color: #999; }
  kbd { background: #333; border-radius: 3px; padding: 0 4px; }

<h1>Melee Web</h1>
<p id="launch"><a href="?MELEE_BOOT_SCENE=vs">Versus</a><a href="?MELEE_BOOT_SCENE=training">Training</a><a href="?MELEE_20XX=1">20XX</a><a href="" id="new-room">New room</a><span id="launch-hint">Pick a mode, then choose a disc image and click Start.</span></p>
<div id="bar">
  <input id="disc" type="file" accept=".iso,.gcm">
  <button id="start" disabled>Start</button>
  <button id="adapter">Connect GC adapter</button>
  <button id="p1" hidden>P1</button><button id="p2" hidden>P2</button>
  <span id="status">Loading engine…</span>
  <span id="stats"></span>
</div>
<canvas id="canvas" width="960" height="720" tabindex="0"></canvas>
<p>A WUP-028 GameCube adapter works through WebHID, with raw 8-bit values. Keyboard fallback:<br><kbd>Arrows</kbd> stick · <kbd>X</kbd> A · <kbd>Z</kbd> B · <kbd>C</kbd> X · <kbd>V</kbd> Y · <kbd>Q</kbd> L · <kbd>E</kbd> R · <kbd>Tab</kbd> Z · <kbd>Enter</kbd> Start · <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> C-stick</p>
<pre id="log"></pre>
